<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>حساب‌کتاب من</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4338ca;
      --accent-glow: #38bdf8;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --shadow-3d: 0 20px 40px -10px rgba(99, 102, 241, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
      direction: rtl;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #040711;
      background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #040711 85%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-viewport {
      width: 100vw;
      max-width: 450px;
      min-height: 100vh;
      background: linear-gradient(160deg, #f8fafc 0%, #cbd5e1 100%);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    @media (min-width: 451px) {
      .app-viewport {
        min-height: 90vh;
        height: 650px;
        border-radius: 36px;
        border: 3.5px solid rgba(56, 189, 248, 0.6);
      }
    }

    .brand-box {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 900;
      color: #1e1b4b;
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .menu-card-huge {
      width: 100%;
      background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%);
      border-radius: 24px;
      padding: 20px 22px;
      text-decoration: none;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 16px;
      border: 3px solid #6366f1;
      box-shadow: var(--shadow-3d);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .menu-card-huge:hover, .menu-card-huge:active {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 25px 50px -10px rgba(99, 102, 241, 0.5);
      background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 100%);
    }

    .icon-wrapper-huge {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
    }

    .card-title-huge {
      font-size: 18px;
      font-weight: 900;
      color: #1e1b4b;
    }

    .card-desc-huge {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 700;
      margin-top: 4px;
      line-height: 1.4;
    }

    .card-arrow {
      margin-right: auto;
      font-size: 20px;
      color: var(--primary);
      font-weight: 900;
    }

    .footer-badge {
      position: absolute;
      bottom: 20px;
      font-size: 11.5px;
      color: #64748b;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <div class="brand-box">
      <div class="brand-title">خوش آمدید 👋</div>
      <div class="brand-subtitle">سامانه اختصاصی حساب‌کتاب من</div>
    </div>

    <!-- دکمه ورود به پنل مدیریت حساب‌ها -->
    <a href="admin.html" class="menu-card-huge">
      <div class="icon-wrapper-huge">👥</div>
      <div>
        <div class="card-title-huge">حساب های من</div>
        <div class="card-desc-huge">مشاهده مانده زنده، لیست حساب‌ها و جزئیات دقیق تراکنش‌ها</div>
      </div>
      <div class="card-arrow">➔</div>
    </a>

    <div class="footer-badge">موسسه مالی © 2026</div>

  </div>

</body>
</html>
